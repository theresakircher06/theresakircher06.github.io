<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple profile page hosted with GitHub Pages.">
  <title>Your Name | Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="profile" aria-labelledby="profile-name">
      <div>
        <p class="eyebrow">Hello, I am</p>
        <h1 id="profile-name">Your Name</h1>
        <p class="intro">A short introduction goes here. Replace this text with what you do, what you care about, or what you are building.</p>
        <nav class="links" aria-label="Profile links">
          <a href="https://github.com/">GitHub</a>
          <a href="mailto:hello@example.com">Email</a>
        </nav>
      </div>

      <aside class="card">
        <h2>Currently</h2>
        <p>Working on interesting things and keeping this page pleasantly simple.</p>
      </aside>
    </section>

    <footer>Built with plain HTML and CSS. Hosted on GitHub Pages.</footer>
  </main>
</body>
</html>
